# Gerado automaticamente pela API — não editar manualmente
# Stream: {{STREAM_ID}}
#
# Os nomes dos programas (xvfb-, x11vnc-, ffmpeg-) são os mesmos em todo backend de
# display, porque status/start/stop dependem deles. No backend gpu, xvfb- sobe o sway,
# x11vnc- roda o wayvnc e ffmpeg- roda o capture-gpu.sh.

[program:xvfb-{{STREAM_ID}}]
command=/opt/scripts/display.sh
environment=DISPLAY_NUM="{{DISPLAY}}",RESOLUTION="{{RESOLUTION}}",STREAM_ID="{{STREAM_ID}}",DISPLAY_BACKEND="{{DISPLAY_BACKEND}}",FPS="{{FPS}}",VAAPI_DEVICE="{{VAAPI_DEVICE}}"
{{DISPLAY_USER}}autorestart=true
priority=10
stdout_logfile=/app/data/logs/{{STREAM_ID}}/xvfb.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/xvfb.log

[program:chromium-{{STREAM_ID}}]
command=bash -c "rm -rf \
    /app/data/streams/{{STREAM_ID}}/chrome-profile/Singleton* \
    /app/data/streams/{{STREAM_ID}}/chrome-profile/.org.chromium.* \
    '/app/data/streams/{{STREAM_ID}}/chrome-profile/Default/Crash Reports' \
    /app/data/streams/{{STREAM_ID}}/chrome-profile/Default/.org.chromium.* \
  && (f=/app/data/streams/{{STREAM_ID}}/chrome-profile/Default/Preferences; [ -f \"$f\" ] && sed -i 's/\"exit_type\":\"[^\"]*\"/\"exit_type\":\"Normal\"/; s/\"exited_cleanly\":false/\"exited_cleanly\":true/' \"$f\" || true) \
  && {{CHROMIUM_PRELUDE}}chromium \
    --no-sandbox \
    --test-type \
{{GPU_FLAGS}}    --window-size={{CHROME_SIZE}} \
    --start-fullscreen \
    --user-data-dir=/app/data/streams/{{STREAM_ID}}/chrome-profile \
    --no-first-run \
{{EXTENSIONS_FLAGS}}{{BG_NET_FLAG}}    --disable-sync \
    --disable-background-timer-throttling \
    --remote-debugging-port={{DEBUG_PORT}} \
    --password-store=basic \
    --hide-crash-restore-bubble \
    --disable-session-crashed-bubble \
    --disable-features=PasswordManagerRedesign,PasswordSuggestions,Translate,InfiniteSessionRestore \
    '{{STREAM_URL}}'"
environment=DISPLAY={{DISPLAY}},STREAM_ID="{{STREAM_ID}}"
autorestart=true
priority=20
startsecs=5
stdout_logfile=/app/data/logs/{{STREAM_ID}}/chromium.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/chromium.log

[program:autologin-{{STREAM_ID}}]
command=/opt/scripts/autologin.sh
autorestart=unexpected
priority=30
startsecs=0
environment=DISPLAY="{{DISPLAY}}",LOGIN_USER="{{USER}}",LOGIN_PASS="{{PASS}}",DEBUG_PORT="{{DEBUG_PORT}}",STREAM_DELAY="{{STREAM_DELAY}}",DISPLAY_BACKEND="{{DISPLAY_BACKEND}}"
stdout_logfile=/app/data/logs/{{STREAM_ID}}/autologin.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/autologin.log

[program:applyzoom-{{STREAM_ID}}]
command=/opt/scripts/applyzoom.sh
autostart=true
autorestart=false
priority=33
startsecs=0
environment=DISPLAY="{{DISPLAY}}",ZOOM_FACTOR="{{ZOOM_FACTOR}}",DISPLAY_BACKEND="{{DISPLAY_BACKEND}}",VNC_PORT="{{VNC_PORT}}",DEBUG_PORT="{{DEBUG_PORT}}"
stdout_logfile=/app/data/logs/{{STREAM_ID}}/applyzoom.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/applyzoom.log

[program:autoreload-{{STREAM_ID}}]
command=/opt/scripts/autoreload.sh
autostart=false
autorestart=unexpected
priority=35
startsecs=0
environment=DEBUG_PORT="{{DEBUG_PORT}}",AUTO_RELOAD="{{AUTO_RELOAD}}",AUTO_RELOAD_INTERVAL="{{AUTO_RELOAD_INTERVAL}}",STREAM_DELAY="{{STREAM_DELAY}}"
stdout_logfile=/app/data/logs/{{STREAM_ID}}/autoreload.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/autoreload.log

[program:x11vnc-{{STREAM_ID}}]
{{DISPLAY_USER}}environment=DISPLAY={{DISPLAY}},STREAM_ID="{{STREAM_ID}}",VNC_PORT="{{VNC_PORT}}",RESOLUTION="{{RESOLUTION}}",FPS="{{FPS}}"
command={{VNC_COMMAND}}
autorestart=true
# no backend gpu o vnc-gpu.sh roda wayvnc + wayvncctl em paralelo
stopasgroup=true
killasgroup=true
priority=40
stdout_logfile=/app/data/logs/{{STREAM_ID}}/vnc.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/vnc.log

[program:ffmpeg-{{STREAM_ID}}]
command={{CAPTURE_COMMAND}}
environment={{CAPTURE_ENV}}
autorestart=true
startretries=999
# a captura roda como pipeline (bash + ffmpeg, ou wf-recorder | ffmpeg): sem isso o
# stop mata só o bash e os filhos ficam órfãos publicando no RTMP
stopasgroup=true
killasgroup=true
priority=60
stdout_logfile=/app/data/logs/{{STREAM_ID}}/ffmpeg.log
stderr_logfile=/app/data/logs/{{STREAM_ID}}/ffmpeg.log
